[project]
name = "neon-app"
version = "0.1.0"
description = "Pupil Labs Neon gaze + scene sources (copied from neon-gaze-app)"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python", "pyzmq", "msgpack"]

[project.optional-dependencies]
realtime = ["pupil-labs-realtime-api>=1.9"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["neon_app"]
