name: SpideySense
options:
  bundleIdPrefix: com.jaidev
  deploymentTarget:
    iOS: "17.0"
targets:
  SpideySense:
    type: application
    platform: iOS
    sources: [SpideySense]
    info:
      path: SpideySense/Info.plist
      properties:
        CFBundleDisplayName: Spidey Sense
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Connects to the Spidey Sense engine on your Mac
        NSBonjourServices: [_spidey._tcp]
        SpideyMacHost: 127.0.0.1   # replaced at build time by scripts/stamp_mac_ip.sh
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaidev.spideysense
        PRODUCT_NAME: SpideySense
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the IP stamp writes into the built Info.plist
    postBuildScripts:
      - name: Stamp Mac IP
        script: bash "$SRCROOT/scripts/stamp_mac_ip.sh"
        basedOnDependencyAnalysis: false

schemes:
  SpideySense:
    build:
      targets:
        SpideySense: all
    run:
      config: Debug
      preActions:
        - name: Start demo engine if needed
          settingsTarget: SpideySense
          script: bash "$SRCROOT/scripts/start_engine.sh"
    archive:
      config: Release
