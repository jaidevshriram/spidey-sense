[project]
name = "spidey-backend"
version = "0.1.0"
description = "Spidey Sense engine: source -> detector -> rules -> haptic sink, plus the app WebSocket and Haptic Playground"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy", "opencv-python", "pyyaml", "anthropic", "python-dotenv", "websockets",
    "fastapi", "uvicorn",
    "pyzmq", "msgpack",                 # Neon via Pupil Capture
    "pupil-labs-realtime-api",          # Neon via Companion phone (wireless)
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spidey"]
