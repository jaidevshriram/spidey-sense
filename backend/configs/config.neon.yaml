# Real Neon (Companion phone over Wi-Fi) + Haiku. Console sink by default; add --sink datafeel-ble (Terminal.app) to buzz.
#   python3 neon/check_companion.py            # first: is the phone reachable, fps, latency
#   python3 backend/run.py --config backend/configs/config.neon.yaml

source:
  type: neon
  mode: realtime              # Neon -> Companion phone -> Wi-Fi -> this Mac (wireless)
  # host: 192.168.1.23        # phone IP (Companion app). Unset: default gateway (Mac on the phone's
                              # hotspot -> phone = gateway), then mDNS discovery
  hearing: true              # mic -> ElevenLabs STT (sound tags) -> "heard" line in the Haiku call; needs ELEVENLABS_API_KEY

detector:
  type: vlm
  model: claude-haiku-5-5
  max_side: 384
  jpeg_quality: 70
  concurrency: 2
  stream: true
  max_tokens: 200
  min_interval_s: 0.4
  env_file: ../../.env          # repo-root .env (relative to this file); only if ANTHROPIC_API_KEY is unset

detect_every_s: 0               # the detector throttles itself
rules_file: rules.json   # shared with the app (Senses tab)      # separate from the app-edited rules.json; falls back to `rules:` below

rules:
  - name: blindspot
    feel: urgent
    if: {unseen: true, min_urgency: 0.6}
    cooldown_s: 3
  - name: heads_up
    feel: ambient
    if: {unseen: true, max_urgency: 0.59}   # blindspot owns >= 0.6
    cooldown_s: 6

sink:
  type: console

log: logs/neon_events.jsonl

server:
  enabled: true
  port: 8765

voice:                          # ElevenLabs: speak fired events + "add a trigger by voice" (needs ELEVENLABS_API_KEY in .env)
  enabled: true                 # no key -> settings.voice.available: false, nothing else changes
  speak: urgent                 # all | urgent (feel == urgent only) | off; the app changes it live (command "voice")
  voice_id: JBFqnCBsd6RMkjVDRZzb
  tts_model: eleven_flash_v2_5
  stt_model: scribe_v2
  language_code: en             # STT hint: short clips otherwise get odd language guesses; remove for auto-detect
  output_format: mp3_22050_32
  voice_settings: {stability: 0.5, similarity_boost: 0.75, speed: 1.1}
  max_age_s: 4.0                # drop a line not ready within this (stale speech is worse than none)
  speak_drafts: true            # read a voice-drafted trigger's summary back
  draft_model: claude-haiku-5-5
  env_file: ../../.env          # repo-root .env (relative to this file)
